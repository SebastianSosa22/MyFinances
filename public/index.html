<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Finanzas Personales</title>
    <!-- Lo que antes agregaba pwa.js al arrancar va aquí: el navegador lo ve antes de descargar el código de la app -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Finanzas" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://yphvecfopkaifhkndaru.supabase.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" data-fonts="1" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <style id="expo-reset">
      html, body { height: 100%; background-color: #0B1220; }
      body { overflow: hidden; margin: 0; }
      #root { display: flex; height: 100%; flex: 1; }
      /* Autocompletado de Safari/Chrome: sin fondo amarillo ni texto negro, se ve como el resto del campo */
      input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 1000px #141C2B inset !important; box-shadow: 0 0 0 1000px #141C2B inset !important;
        -webkit-text-fill-color: #E8EDF5 !important; caret-color: #E8EDF5; transition: background-color 600000s 0s, color 600000s 0s;
      }
      input:autofill { box-shadow: 0 0 0 1000px #141C2B inset !important; -webkit-text-fill-color: #E8EDF5 !important; }
      /* Pantalla de carga mientras baja el código de la app. React muestra la misma (SplashScreen.js) y luego la desvanece */
      .boot { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .boot b { margin-top: 28px; font: 700 22px/1.2 "Inter Tight", -apple-system, sans-serif; letter-spacing: -0.4px; color: #E8EDF5; animation: boot-name .6s ease-out both; }
      @keyframes boot-name { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      .boot-logo { position: relative; width: 96px; height: 96px; }
      .boot-logo img { position: relative; width: 96px; height: 96px; border-radius: 22px; animation: boot-in .6s cubic-bezier(.2,.9,.3,1.3) both, boot-breathe 1.6s ease-in-out .6s infinite; }
      .boot-logo i { position: absolute; inset: 0; border-radius: 26px; border: 2px solid #5EE6A8; opacity: 0; animation: boot-ring 1.6s ease-out .6s infinite; }
      @keyframes boot-in { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
      @keyframes boot-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes boot-ring { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(1.7); } }
    </style>
  </head>

  <body>
    <noscript>Activa JavaScript para usar la app.</noscript>
    <div id="root"><div class="boot"><div class="boot-logo"><i></i><img src="/icon-192.png" alt="" /></div><b>Finanzas</b></div></div>
  </body>
</html>
